<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Estoria</title>
  <!--
    The Estoria mark: a single story card, tilted, as it sits on the board.
    Drawn in the card's own coordinate space (290 x 323) and rotated as a whole,
    so the ruled lines stay parallel to the card rather than to the canvas.
    No filters or blurs — the heavy outline carries the sticker look, and the
    mark has to survive being drawn at 16px in a browser tab.
  -->
  <g transform="translate(256 256) rotate(-19) translate(-145 -161.5)">
    <rect x="0" y="0" width="290" height="323" rx="23"
          fill="#f2ece1" stroke="#3d3129" stroke-width="9" />
    <circle cx="114" cy="86" r="17" fill="#2f6b4f" />
    <g stroke="#33302c" stroke-width="16" stroke-linecap="round">
      <line x1="143" y1="88" x2="245" y2="88" />
      <line x1="51" y1="140" x2="251" y2="140" />
      <line x1="57" y1="191" x2="260" y2="191" />
      <line x1="120" y1="248" x2="260" y2="248" />
    </g>
  </g>
</svg>
