<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Estoria</title>
  <!--
    Maskable source: same mark, but full-bleed on the app's paper background and
    scaled down to 0.72. Android, ChromeOS and macOS crop an installed app's
    icon to their own shape, so anything outside the centre 80% circle (the
    "safe zone") can be cut. At this scale the tilted card's diagonal is ~398px
    against a 409px safe circle, so no corner is ever clipped.
    The transparent-background version lives in icon.svg.
  -->
  <rect width="512" height="512" fill="#e9e0cd" />
  <g transform="translate(256 256) scale(0.72) rotate(-19) translate(-145 -161.5)">
    <rect x="0" y="0" width="290" height="323" rx="23"
          fill="#f2ece1" stroke="#3d3129" stroke-width="9" />
    <circle cx="114" cy="86" r="17" fill="#2f6b4f" />
    <g stroke="#33302c" stroke-width="16" stroke-linecap="round">
      <line x1="143" y1="88" x2="245" y2="88" />
      <line x1="51" y1="140" x2="251" y2="140" />
      <line x1="57" y1="191" x2="260" y2="191" />
      <line x1="120" y1="248" x2="260" y2="248" />
    </g>
  </g>
</svg>
